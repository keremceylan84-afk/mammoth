name: Build watch face

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Watch Face Format XML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools/bin
          gh release download --repo google/watchface --pattern 'wff-validator.jar' --dir tools/bin --clobber
          java -jar tools/bin/wff-validator.jar 2 app/src/main/res/raw/watchface.xml | tee validation.log
          ! grep -q -E 'SEVERE|FAILED' validation.log

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: mammoth-watchface-apk
          path: app/build/outputs/apk/release/*.apk

      # Rolling "apk" release: always holds the latest build at a fixed download URL.
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk mammoth-sport.apk
          git tag -f apk "$GITHUB_SHA"
          git push -f origin refs/tags/apk
          gh release view apk >/dev/null 2>&1 || \
            gh release create apk --title "Mammoth Sport APK" \
              --notes "Latest build: https://github.com/${{ github.repository }}/releases/download/apk/mammoth-sport.apk"
          gh release upload apk mammoth-sport.apk --clobber
